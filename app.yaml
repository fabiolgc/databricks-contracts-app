# Databricks Apps Configuration
# FastAPI backend serving static Next.js frontend

command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]

# OAuth scopes required for the app
permissions:
  - permission: "sql"
    description: "Execute SQL queries"
  - permission: "vectorsearch.vector-search-indexes"
    description: "Manage Vector Search indexes"
  - permission: "serving.serving-endpoints"
    description: "Access embedding model endpoints"
  - permission: "catalog.tables:read"
    description: "Read Unity Catalog tables"
  - permission: "catalog.schemas:read"
    description: "Read Unity Catalog schemas"
  - permission: "catalog.catalogs:read"
    description: "Read Unity Catalog catalogs"
  - permission: "files.files"
    description: "Manage files in volumes"

env:
  # Unity Catalog configuration
  - name: DATABRICKS_CATALOG
    value: "fabio_goncalves"
  
  - name: DATABRICKS_SCHEMA
    value: "customer_cielo"
  
  # Volume name (base name only)
  - name: DATABRICKS_VOLUME
    value: "pdf"
  
  # SQL Warehouse configuration
  - name: DATABRICKS_WAREHOUSE_ID
    value: "604c0ed0a11f8a1d"
  
  - name: DATABRICKS_SERVER_HOSTNAME
    value: "e2-demo-field-eng.cloud.databricks.com"
  
  - name: DATABRICKS_HTTP_PATH
    value: "/sql/1.0/warehouses/09231fd5489fc752"
  
  # Vector Search configuration
  - name: VECTOR_SEARCH_ENDPOINT
    value: "one-env-shared-endpoint-12"
  
  # Timeout configurations (in seconds)
  - name: VECTOR_INDEX_CREATION_TIMEOUT
    value: "300"
  
  - name: VECTOR_INDEX_SYNC_TIMEOUT
    value: "300"
  
  - name: API_REQUEST_TIMEOUT
    value: "120"
  
  # LLM Model Serving endpoint for Agent
  - name: LLM_ENDPOINT
    value: "databricks-meta-llama-3-3-70b-instruct"
